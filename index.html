<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>2048</h1>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">分数</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box best">
                    <div class="score-label">最高分</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
            </div>
        </header>

        <div class="info">
            <p>使用键盘方向键 ↑ ↓ ← → 或滑动屏幕来移动方块</p>
            <p>相同数字的方块碰撞时会合并</p>
            <p>目标：达到 2048！</p>
        </div>

        <button id="restart-btn" class="restart-btn">重新开始</button>

        <div class="game-container">
            <div class="game-grid" id="grid">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
            <div class="tiles-container" id="tiles"></div>
        </div>

        <div class="game-over-overlay" id="game-over">
            <div class="overlay-content">
                <h2 id="game-over-text">游戏结束</h2>
                <p id="final-score">最终得分: 0</p>
                <button id="try-again-btn">再玩一次</button>
            </div>
        </div>

        <div class="game-over-overlay" id="win-overlay">
            <div class="overlay-content">
                <h2>🎉 恭喜！</h2>
                <p>你达到了 2048！</p>
                <div class="win-buttons">
                    <button id="keep-playing-btn">继续游戏</button>
                    <button id="new-game-btn">新游戏</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
