<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注番茄钟 - 生活效率工具箱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>专注番茄钟 - 生活效率工具箱</h1>
        </header>

        <main>
            <div class="status-indicator">
                <span class="status-label">当前状态:</span>
                <span class="status-value" id="status">准备开始</span>
            </div>

            <div class="timer-display">
                <div class="timer-circle">
                    <div class="timer-progress" id="progress"></div>
                    <div class="timer-time" id="time">25:00</div>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="control-btn start-btn">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">开始</span>
                </button>
                <button id="pause-btn" class="control-btn pause-btn" disabled>
                    <span class="btn-icon">⏸</span>
                    <span class="btn-text">暂停</span>
                </button>
                <button id="reset-btn" class="control-btn reset-btn">
                    <span class="btn-icon">↺</span>
                    <span class="btn-text">重置</span>
                </button>
                <button id="skip-btn" class="control-btn skip-btn" disabled>
                    <span class="btn-icon">⏭</span>
                    <span class="btn-text">跳过</span>
                </button>
            </div>

            <div class="settings">
                <h2>时长设置</h2>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label for="focus-duration">专注时长 (分钟)</label>
                        <input type="number" id="focus-duration" min="1" max="60" value="25">
                    </div>
                    <div class="setting-item">
                        <label for="break-duration">休息时长 (分钟)</label>
                        <input type="number" id="break-duration" min="1" max="60" value="5">
                    </div>
                    <div class="setting-item">
                        <label for="long-break-duration">长休息时长 (分钟)</label>
                        <input type="number" id="long-break-duration" min="1" max="60" value="15">
                    </div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="pomodoro-count">0</span>
                    <span class="stat-label">已完成番茄钟</span>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
